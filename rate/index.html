<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Rate Spin Wheel." />
    <title>Rate Spin Wheel</title>
    <link rel="icon" type="image/png" sizes="128x128" href="../icon128.png" />
    <link rel="stylesheet" href="../service.css" />
  </head>
  <body>
    <main class="shell">
      <a class="brand" href="../">
        <img src="../icon128.png" width="30" height="30" alt="" />
        <span>Spin Wheel</span>
      </a>

      <section class="card rate-card">
        <div class="full-stars">
          <div class="rating-group" id="rating-group">
            <input name="fst" value="5" type="radio" disabled checked />
            <label for="fst-1">
              <a class="star" data-stars="1" href="../feedback/" aria-label="1 star">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
              </a>
            </label>
            <input name="fst" id="fst-1" value="1" type="radio" />
            <label for="fst-2">
              <a class="star" data-stars="2" href="../feedback/" aria-label="2 stars">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
              </a>
            </label>
            <input name="fst" id="fst-2" value="2" type="radio" />
            <label for="fst-3">
              <a class="star" data-stars="3" href="../feedback/" aria-label="3 stars">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
              </a>
            </label>
            <input name="fst" id="fst-3" value="3" type="radio" />
            <label for="fst-4">
              <a class="star" data-stars="4" href="../feedback/" aria-label="4 stars">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
              </a>
            </label>
            <input name="fst" id="fst-4" value="4" type="radio" />
            <label for="fst-5">
              <a class="star" data-stars="5" href="../feedback/" aria-label="5 stars">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
              </a>
            </label>
            <input name="fst" id="fst-5" value="5" type="radio" />
          </div>
        </div>

        <h1 class="rate-title">How is Spin Wheel working for you?</h1>
        <p class="rate-sub" id="rate-sub">Pick a star.</p>
      </section>

      <nav class="foot">
        <a href="../">Welcome page</a>
        <a href="../feedback/">Send feedback</a>
      </nav>
    </main>

    <script src="../config.js"></script>
    <script src="../rate.js"></script>
  </body>
</html>
