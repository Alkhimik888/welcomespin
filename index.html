<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Spin Wheel is installed</title>
    <link rel="icon" type="image/png" sizes="128x128" href="./icon128.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="welcome-shell">
      <h1>
        <button class="party" id="confetti-trigger" type="button" aria-label="Celebrate again">🎉</button>
        Spin Wheel is installed!
      </h1>
      <p class="line">Click the puzzle piece <span class="n">1</span> in the top right of your browser.</p>
      <p class="line">Then, click the little pin <span class="n">2</span> next to the extension:</p>
      <img class="shot" src="./shot-pin.png" alt="Chrome window: the puzzle button (1) opens the light Extensions menu; the pin (2) next to Spin Wheel keeps its icon on the toolbar" />

      <p class="line">Click the highlighted icon <span class="n">3</span> — paste your list, then hit Spin:</p>
      <img class="shot" src="./shot-click.png" alt="Chrome window with the pinned Spin Wheel icon highlighted on the toolbar (3)" />
    </main>

    <script src="./welcome.js"></script>
  </body>
</html>
